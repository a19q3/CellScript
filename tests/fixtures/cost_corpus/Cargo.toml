[workspace]
resolver = "3"

[package]
name = "cost-corpus-rust-refs"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"

[[bin]]
name = "nft-lock"
path = "src/nft_lock.rs"

[[bin]]
name = "pool-merge"
path = "src/pool_merge.rs"

[[bin]]
name = "schema-roll"
path = "src/schema_roll.rs"

[dependencies]
ckb-std = { version = "=1.1.0", default-features = false }

[profile.release]
opt-level = "z"
lto = "thin"
codegen-units = 1
panic = "abort"
strip = false
